# ---------------------------------------------------------------------------
# A surface in two versions
# ---------------------------------------------------------------------------

# Why wait: add a copy of an object with a different version so that it can be
# tested - and the rule it exercises: the short uri is accepted if there is no
# conflict (or if the object has no version), with the version if there is a
# conflict.
#
# The copied surface is the one the scene draws and that is exported to OBJ,
# **H3 in triangles** (`h3-triangulee`): a resqml22
# `TriangulatedSetRepresentation` that declares **no** `objectVersion`. The
# original therefore keeps its short uri,
# `eml:///resqml22.TriangulatedSetRepresentation(<uuid>)`, and the copy - same
# uuid, same type, same content, `objectVersion` "2" - takes the form with its
# version, `…(uuid=<uuid>,version='2')`. It is written by the one door that
# adds a version (`EpcStore::put_as_new_version`): an ordinary `put` would
# replace the original.
#
# **It is placed just before `coupe`**: the section reads the whole package
# (`objects`, `every`) and the page, which selects by default everything the
# package holds, cuts the copy too; the drawing versioned next to the model,
# replayed from the example, therefore names it - and the `coupe` step refuses
# a drawing that names an object the package does not hold yet. The project,
# further down, gathers it with the rest.
[[etape]]
nom = "h3-triangulee-v2"
operation = "new-version"
entrees = [ { creneau = "object", etape = "h3-triangulee", type = "TriangulatedSetRepresentation" } ]
set = { version = "2" }

# The A-A' section. Motivation: to put it in Lutetia, create a polylineset (with
# suitable interpretations and feature) to represent the profile line, an
# activity instance and template for the computation of the profiles, and link
# the SVG and PNG section images to the activity as a result. A `CulturalFeature`
# of kind `section line` and its `GenericFeatureInterpretation`, the
# `PolylineSetRepresentation` - patch 0 the trace, patch 1 the three cross
# profiles - and a *part-address* `Attachment` per image, which names the
# polyline; the `section-view` activity lists them all as outputs. **The trace
# is read from the SVG's metadata**, never given again here: the line written is
# the one that was drawn. The images are computed from this very package - the
# variant without errors, so that every object it cut exists in both packages
# (`donnees/profils/`, and the README of this folder gives the command);
# at 35 m NGF, the elevation of the mean ground, like the extent. Each setting
# of the section is a parameter of the template, read in the drawing and refused
# if it contradicts it; the wells and surfaces cut are the `input`s of the
# activity (`objects`, filled with the whole package) - hence the place of the
# step, **after** the last own object and just before the project.
[[etape]]
nom = "coupe"
operation = "section-view"
entrees = [
  { creneau = "svg", fichier = "donnees/profils/coupe-lutetia.svg" },
  { creneau = "png", fichier = "donnees/profils/coupe-lutetia.png" },
]
set = { sourceEpsg = 2154, project = 2154, vertical = 5720, elevation = 35.0, title = "Lutetia - section A-A'" }

