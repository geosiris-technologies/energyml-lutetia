# ---------------------------------------------------------------------------
# Step 13 - the `[ERROR]` model: the deliberate anomalies
# ---------------------------------------------------------------------------
#
# To be placed **at the end of the recipe, after `projet`**: no clean step
# follows, so no slot that a clean step leaves empty (`read::every`) can pick
# up an `[ERROR]` object, and the project does not contain them.
#
# The model design: *deliberately wrong objects, each against a written rule,
# to prove that the check guarding it fires*. **The `[ERROR]` objects are
# leaves**: they may reference a clean object (F1, the top of the Lutetian,
# the GTH-1 series that is copied), but no clean object references them.
# Every title starts with `[ERROR]`, and the `[ERROR] Lutetia` folder
# gathers them all.
#
# Each defect is **written by an ordinary operation, then stated in one
# field** by `edit-object`: the field, the old value, the new one, in the
# plan. The writers stay strict - `fault-from-sticks` still refuses
# `IsListric` on a reverse fault, `collection` still computes
# `HomogeneousDatatype` -, and the anomaly is one line of this recipe.
#
# What `energyml check` must find, **exactly**, and nothing else (0
# errors; the E-nn are warnings until their severity is settled):
#
#   E-01  properties  abstract kind `force per length`  « [ERROR] GTH-9 - force per length »
#   E-02  properties  abstract kind `property`          « [ERROR] GTH-9 - property »
#   E-03  house/discrete-value-in-lookup                « [ERROR] GTH-9 - [ERROR] lithology »
#   E-04  house/time-series-asset-resolves              « [ERROR] GTH-99 - wellhead pressure »
#   E-06  trg/one-definitive-trajectory-per-wellbore    the Wellbore « [ERROR] GTH-9 »
#   E-07  trg/is-listric-iff-normal                     « [ERROR] F9 - interpretation »
#   E-08  trg/homogeneous-collection                    the collection « [ERROR] wells »
#         trg/wellbore-interpretation-set-holds-wellbores  the earth model interpretation « [ERROR] Lutetia - deliberate anomalies »
#   E-09  trg/contact-element-is-geological             the structural organization « [ERROR] Lutetia - structure »
#
# **E-05 is not written**: it is the unit -> quantity-class table rule,
# which `check` cannot judge yet - `g/L` on a dimensionless kind would come
# out as "not verified", not as a defect. Writing it now would pin a
# silence.

# The `[ERROR]` well (E-06, and the support of E-01…E-03): a vertical hole of
# 60 m, planned, in the wells' frame, the ground read from the `sol` surface
# as for the doublet. **`GTH-9`, and the E-04 series names `GTH-99`**: the two
# defects were fighting over the name (a series naming `well(GTH-9)` would
# stay silent if a well were called that); the title `[ERROR] GTH-9` does not
# answer to the name `GTH-9` anyway, and `GTH-99` rules out any ambiguity.
# Invented head and length, between GTH-1 and GTH-3.
[[etape]]
nom = "erreur-gth-9"
groupe = "erreur"                # the `[ERROR]` model: `--without erreur` leaves it out
operation = "well-from-plan"
entrees = [ { creneau = "surface", etape = "sol", type = "Grid2dRepresentation" } ]
set = { crs = { etape = "forages", type = "LocalEngineeringCompoundCrs" }, title = "[ERROR] GTH-9", headX = 651700.0, headY = 6861250.0, datumHeight = 3.0, datumKind = "kelly bushing", sections = ["hold to 60"], step = 5.0, maxDepth = 200.0 }

# Its WITSML side: a `Well`, a `Wellbore`, a `Definitive` `Trajectory`
# (surface to bottom, a single RESQML path).
[[etape]]
nom = "erreur-witsml-gth-9"
groupe = "erreur"                # the `[ERROR]` model: `--without erreur` leaves it out
operation = "witsml-wells"
entrees = [
  { creneau = "frames", etape = "erreur-gth-9", type = "WellboreFrameRepresentation" },
  { creneau = "projected", etape = "forages", type = "ProjectedCrs" },
]
set = { existence = "planned", synthetic = true, country = "France", basin = "Paris Basin" }

# E-06: a **second** `Definitive` `Trajectory` on the same `Wellbore` - the
# copy of the first, under another uuid. WITSML TRG 2.1 §16.6 p. 350, on
# `Trajectory.Definitive`: *« There can only be one trajectory per wellbore
# with definitive=true »*. The finding is placed on the **Wellbore** (the
# object of the rule), an `[ERROR]` object: no clean well receives one.
[[etape]]
nom = "erreur-trajectoire-bis"
groupe = "erreur"                # the `[ERROR]` model: `--without erreur` leaves it out
operation = "edit-object"
entrees = [ { creneau = "object", etape = "erreur-witsml-gth-9", type = "Trajectory" } ]
set = { copy = "[ERROR] GTH-9 - trajectory, a second definitive one", fields = ['Citation.Description = "[ERROR] E-06 (docs/errors.md): a copy of the definitive trajectory of [ERROR] GTH-9, definitive too - WITSML TRG 2.1 §16.6 p. 350: there can only be one trajectory per wellbore with definitive=true."'] }

# E-01, E-02, E-03: three properties on the frame of `[ERROR] GTH-9`, from
# `donnees/erreurs/proprietes.csv` and its template. The first two are
# placed on **abstract** kinds of the Energistics 2.3 dictionary -
# `force per length` (e75d460c, `IsAbstract` true) and its root `property`
# (a48c9c25) -: an abstract kind is a category, no value is put on it
# (`property_kind::check`). The design first put E-01 on the GTH-1 frame; on
# that of `[ERROR] GTH-9`, the property title carries `[ERROR]`, and nothing
# changes about the rule. The third, discrete (`litho type`), writes its codes
# as ranks of its table - sand 0, marl 1, chalk 2 -, and its column is called
# "[ERROR] lithology" because that name is the title of the table.
[[etape]]
nom = "erreur-proprietes"
groupe = "erreur"                # the `[ERROR]` model: `--without erreur` leaves it out
operation = "properties-from-table"
entrees = [
  { creneau = "table", fichier = "donnees/erreurs/proprietes.csv" },
  { creneau = "frames", etape = "erreur-gth-9", type = "WellboreFrameRepresentation" },
]
template = "donnees/erreurs/proprietes.template.json"

# E-03: the lithology table receives a **numeric** key column, counted from
# 1 - the confusion at stake ("the integer is the row rank" is our writing
# convention, whereas the spec looks the value up in the key column). Code 0
# (sand, two nodes) no longer has a row: common TRG 2.3 §9.1 p. 190,
# *« Defines a key column which make the table a lookup table »*, and the
# house reading `house/discrete-value-in-lookup` reports it. The design
# targeted the table written by the `etages` step, which waits for its
# re-reading: the table here is that of the `[ERROR]` property, titled
# "[ERROR] lithology" by the name of its column (a title is not rewritten in
# place: every reference to the table keeps a copy, which would become
# stale). The key is an `identifier` (311dcaba), the kind given to keys.
[[etape]]
nom = "erreur-table-lithologie"
groupe = "erreur"                # the `[ERROR]` model: `--without erreur` leaves it out
operation = "edit-object"
entrees = [ { creneau = "object", etape = "erreur-proprietes", type = "ColumnBasedTable" } ]
set = { fields = [
  'KeyColumn = [{"Title": "code", "ValueCountPerRow": 1, "PropertyKind": {"$type": "eml23.DataObjectReference", "Uuid": "311dcaba-6512-4144-aa7c-79a9de19b4ab", "QualifiedType": "eml23.PropertyKind", "Title": "identifier"}, "Values": {"$type": "eml23.IntegerXmlArray", "CountPerValue": 1, "NullValue": -9999, "Values": [1, 2, 3]}}]',
] }

# E-04: a `TimeSeriesData` whose `asset identifier` resolves to nothing - the
# wellhead pressure of GTH-1 (`prodml-doublet`), copied, its key naming
# `well(GTH-99)`, which no `Well` of the package carries (Energistics
# Identifier Specification v4.0 §6.3 p. 14 for the grammar). `Key[0]` is the
# `asset identifier` key that `prodml-doublet` writes first.
[[etape]]
nom = "erreur-serie"
groupe = "erreur"                # the `[ERROR]` model: `--without erreur` leaves it out
operation = "edit-object"
entrees = [ { creneau = "object", etape = "prodml-doublet", type = "TimeSeriesData", titre = "GTH-1 - wellhead pressure" } ]
set = { copy = "[ERROR] GTH-99 - wellhead pressure", fields = [
  'Key[0]._ = "eml://lutetia.geosiris.com/well(GTH-99)/wellbore(01)/wellhead"',
  'Citation.Description = "[ERROR] E-04 (docs/errors.md): a copy of the wellhead pressure of GTH-1 whose asset identifier names well(GTH-99), which no well of this package is."',
] }

# E-07: F9, written **normal and listric** by `fault-from-sticks` - which
# would refuse `IsListric` on a reverse fault -, then stated **reverse**:
# `IsListric` stays. Interpretations.xsd l. 659-662, TRG 2.2 §6.20 p. 188:
# *« Must be present if the fault is normal. Must not be present if the fault
# is not normal. »* Synthetic plane south of the extent, strike N75°E,
# dip 60° towards 165°, from 20 to −100 m NGF.
[[etape]]
nom = "erreur-f9"
groupe = "erreur"                # the `[ERROR]` model: `--without erreur` leaves it out
operation = "fault-from-sticks"

[etape.set]
crs = { etape = "forages", type = "LocalEngineeringCompoundCrs" }
title = "[ERROR] F9"
geometry = "plane"
trace = "651300 6860900 20; 651493.19 6860951.76 20"
dip = 60.0
dipAzimuth = 165.0
verticalExtent = 120.0
throw = ["normal"]
listric = true
sealed = false
synthetic = true
source = "synthetic - F9, the fault of the [ERROR] model (E-07); invented plane, from 20 to −100 m NGF"

[[etape]]
nom = "erreur-f9-inverse"
groupe = "erreur"                # the `[ERROR]` model: `--without erreur` leaves it out
operation = "edit-object"
entrees = [ { creneau = "object", etape = "erreur-f9", type = "FaultInterpretation" } ]
set = { fields = [
  'ThrowInterpretation[0].Throw = ["reverse"]',
  'Citation.Description = "[ERROR] E-07 (docs/errors.md): a reverse fault that keeps IsListric - Interpretations.xsd l. 659-662, TRG 2.2 §6.20 p. 188: IsListric must not be present if the fault is not normal."',
] }

# The `[ERROR]` structural organization, which interprets the `[ERROR]` model
# (by its title, the same object as the `erreur-modele` step writes) and
# carries F9 and F1 - a reference to a clean object, which is allowed (the
# leaves rule). The contact is written valid, between two interpretations;
# E-09 comes next.
[[etape]]
nom = "erreur-structure"
groupe = "erreur"                # the `[ERROR]` model: `--without erreur` leaves it out
operation = "structural-organisation"
entrees = [
  { creneau = "boundaries", etape = "erreur-f9", type = "FaultInterpretation" },
  { creneau = "boundaries", etape = "f1", type = "FaultInterpretation" },
]
set = { title = "[ERROR] Lutetia - structure", ordering = "age", modelTitle = "[ERROR] Lutetia - deliberate anomalies", contacts = ["[ERROR] F9 stops F1"] }

# E-09: the subject of the contact becomes the **surface** of F9, a
# representation - TRG 2.2 §6.9 p. 173: a contact links geological
# interpretations or a boundary, not a geometry. The direct object stays F1,
# an interpretation: a single finding. The design targeted the surface of H3,
# which no step writes yet; the surface of F9 is the same fault. The
# reference replaces what the `ContactElement` names and keeps its qualifier.
[[etape]]
nom = "erreur-contact"
groupe = "erreur"                # the `[ERROR]` model: `--without erreur` leaves it out
operation = "edit-object"
entrees = [ { creneau = "object", etape = "erreur-structure", type = "StructuralOrganizationInterpretation" } ]
set = { reference = { etape = "erreur-f9", type = "TriangulatedSetRepresentation" }, referenceAt = "ContactInterpretation[0].Subject" }

# "[ERROR] wells", which mixes the `WellboreInterpretation` of
# `[ERROR] GTH-9` and a `HorizonInterpretation` (the top of the Lutetian,
# clean). `collection` writes `HomogeneousDatatype` false on the collection
# **and** on its association - which is what the members are. The association
# set written alongside is half of the `[ERROR]` association sets (see
# `erreur-dossier`).
[[etape]]
nom = "erreur-puits"
groupe = "erreur"                # the `[ERROR]` model: `--without erreur` leaves it out
operation = "collection"
entrees = [
  { creneau = "members", etape = "erreur-gth-9", type = "WellboreInterpretation" },
  { creneau = "members", etape = "modele-eocene", type = "HorizonInterpretation", titre = "Lutetian TOP" },
]
set = { title = "[ERROR] wells", kind = "folder" }

# E-08, first finding: the collection says it is homogeneous. Collection.xsd
# l. 66-70: *« If true all data objects in the collection are of the same
# Energistics data type »*. The association keeps false: the second check
# (`trg/homogeneous-association`) stays silent, and E-08 gives **two**
# findings, not three.
[[etape]]
nom = "erreur-puits-homogene"
groupe = "erreur"                # the `[ERROR]` model: `--without erreur` leaves it out
operation = "edit-object"
entrees = [ { creneau = "object", etape = "erreur-puits", type = "DataobjectCollection" } ]
set = { fields = ['HomogeneousDatatype = true'] }

# The `[ERROR]` `Model` and `EarthModelInterpretation` "[ERROR] Lutetia -
# deliberate anomalies": `Structure` -> the `[ERROR]` structural organization,
# `WellboreInterpretationSet` -> "[ERROR] wells". E-08, second finding, on the
# earth model interpretation: TRG 2.2 §6.19 p. 187, *« the
# DataobjectCollection must only contain WellboreInterpretation »*. The
# page's model selector shows one more.
[[etape]]
nom = "erreur-modele"
groupe = "erreur"                # the `[ERROR]` model: `--without erreur` leaves it out
operation = "earth-model"
entrees = [
  { creneau = "structures", etape = "erreur-structure", type = "StructuralOrganizationInterpretation" },
  { creneau = "wellboreSets", etape = "erreur-puits", type = "DataobjectCollection" },
]
set = { title = "[ERROR] Lutetia - deliberate anomalies", interpretationTitle = "[ERROR] Lutetia - deliberate anomalies" }

# The "[ERROR] Lutetia" folder, `Kind` folder: **every** `[ERROR]` step enters
# it whole, WITSML and PRODML included - a `Model` only reaches the geology.
# Its association set and that of `erreur-puits` are the `[ERROR]` association
# sets: `collection` writes one set per collection, so these are **two**
# `[ERROR]` objects, never the project's association set, which is clean.
# What a step returns without `type` also includes its activity and the
# canonical template of its operation, as for the project: those do not
# carry `[ERROR]` at the head of their title, and the workflow root names
# these activities - the only reference from a clean object to the
# `[ERROR]` one, that of provenance.
[[etape]]
nom = "erreur-dossier"
groupe = "erreur"                # the `[ERROR]` model: `--without erreur` leaves it out
operation = "collection"
entrees = [
  { creneau = "members", etape = "erreur-gth-9" },
  { creneau = "members", etape = "erreur-witsml-gth-9" },
  { creneau = "members", etape = "erreur-trajectoire-bis" },
  { creneau = "members", etape = "erreur-proprietes" },
  { creneau = "members", etape = "erreur-table-lithologie" },
  { creneau = "members", etape = "erreur-serie" },
  { creneau = "members", etape = "erreur-f9" },
  { creneau = "members", etape = "erreur-f9-inverse" },
  { creneau = "members", etape = "erreur-structure" },
  { creneau = "members", etape = "erreur-contact" },
  { creneau = "members", etape = "erreur-puits" },
  { creneau = "members", etape = "erreur-puits-homogene" },
  { creneau = "members", etape = "erreur-modele" },
]
set = { title = "[ERROR] Lutetia", kind = "folder" }
